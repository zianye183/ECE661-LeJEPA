# Tiny settings for a fast end-to-end check. Combine with any method:
#   python train.py --method lejepa --config configs/smoke.yaml
experiment: smoke
data:
  dataset: fake
  num_workers: 0
train:
  epochs: 1
  batch_size: 32
  warmup_epochs: 0
  save_every: 1
eval:
